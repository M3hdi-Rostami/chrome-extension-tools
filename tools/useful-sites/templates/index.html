<template id="tpl-useful-sites">
    <div class="h-full flex flex-col gap-3 text-sm">

        <p class="text-xs text-gray-500 leading-relaxed text-center px-1">
            سایت‌های پرکاربرد را با عنوان ذخیره کنید تا همیشه دم دست باشند
        </p>

        <div class="relative">
            <input id="us-search" type="search" placeholder="جستجو در لینک‌ها..."
                class="w-full text-xs border border-gray-200 rounded-xl py-2.5 pr-9 pl-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300"
                autocomplete="off" />
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>

        <div id="us-list" class="flex-1 overflow-y-auto no-scrollbar space-y-2 pb-1"></div>

        <div class="flex gap-2 shrink-0">
            <button type="button" id="us-add-btn"
                class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium py-2.5 rounded-xl transition-colors">
                + افزودن سایت
            </button>
            <button type="button" id="us-edit-mode-btn"
                class="px-3 bg-white hover:bg-gray-50 text-gray-700 text-xs font-medium py-2.5 rounded-xl border border-gray-200 transition-colors">
                ویرایش
            </button>
        </div>

        <div id="us-editor" style="display:none"
            class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-3">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-4 space-y-3 border border-gray-100"
                role="dialog" aria-modal="true" aria-labelledby="us-editor-title">
                <h3 id="us-editor-title" class="text-sm font-bold text-gray-800">سایت جدید</h3>
                <div class="space-y-2">
                    <label for="us-editor-label" class="text-[11px] text-gray-500 block">عنوان</label>
                    <input id="us-editor-label" type="text" maxlength="80" placeholder="مثلاً Canva"
                        class="w-full text-xs border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-300" />
                </div>
                <div class="space-y-2">
                    <div class="flex items-center justify-between gap-2">
                        <label for="us-editor-url" class="text-[11px] text-gray-500">آدرس سایت</label>
                        <button type="button" id="us-from-tab-btn"
                            class="text-[11px] text-indigo-600 hover:text-indigo-500 font-medium px-1 py-0.5 rounded">
                            از تب فعلی
                        </button>
                    </div>
                    <input id="us-editor-url" type="url" dir="ltr" maxlength="500"
                        placeholder="https://example.com"
                        class="w-full text-xs border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-300" />
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="button" id="us-editor-cancel"
                        class="flex-1 text-xs py-2.5 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-50">
                        انصراف
                    </button>
                    <button type="button" id="us-editor-save"
                        class="flex-1 text-xs py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium">
                        ذخیره
                    </button>
                </div>
            </div>
        </div>

        <div id="us-toast"
            class="fixed bottom-16 left-1/2 -translate-x-1/2 bg-indigo-600 text-white text-xs font-medium px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 max-w-[90%] text-center">
        </div>
    </div>
</template>
